<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Navy Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081426" />
      <stop offset="50%" stop-color="#0F2747" />
      <stop offset="100%" stop-color="#060E1A" />
    </linearGradient>

    <!-- Fiber Optic Vibrant Cyan to Cobalt -->
    <linearGradient id="fiberPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Emerald Operational Stability Gradient -->
    <linearGradient id="accentEmerald" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Subtle Metallic Border Ring -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.5" />
    </linearGradient>

    <!-- Internal Radial Bloom -->
    <radialGradient id="centerBloom" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#2563EB" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0F2747" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Modern Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="104" fill="none" stroke="url(#borderGlow)" stroke-width="3" />

  <!-- Ambient Light Field -->
  <circle cx="256" cy="240" r="180" fill="url(#centerBloom)" />

  <!-- Optical Fiber Grid Pattern / High-Tech Mesh (Subtle) -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1.5">
    <circle cx="256" cy="256" r="80" fill="none" />
    <circle cx="256" cy="256" r="140" fill="none" />
    <circle cx="256" cy="256" r="200" fill="none" />
    <line x1="56" y1="256" x2="456" y2="256" />
    <line x1="256" y1="56" x2="256" y2="456" />
  </g>

  <!-- THE ICONIC "B" BROADBAND & FINANCIAL FLOW MARK -->
  <g>
    <!-- Left Authoritative Backbone (Fiber Trunk) -->
    <path d="M 132 120 C 132 108 141 99 153 99 L 175 99 C 187 99 196 108 196 120 L 196 392 C 196 404 187 413 175 413 L 153 413 C 141 413 132 404 132 392 Z"
          fill="url(#fiberPrimary)" />

    <!-- Top Fiber Loop (Broadband & Digital Signal Wave) -->
    <path d="M 184 100 L 268 100 C 330 100 376 138 376 195 C 376 250 330 286 268 286 L 184 286"
          fill="none" stroke="url(#fiberPrimary)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Bottom Fiber Loop (Financial Collection & Interconnection) -->
    <path d="M 184 266 L 284 266 C 348 266 396 304 396 361 C 396 414 348 412 284 412 L 184 412"
          fill="none" stroke="url(#accentEmerald)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Broadband Signal Waves (Radiating from Top Right) -->
    <path d="M 390 136 C 418 162 434 196 434 234"
          fill="none" stroke="#38BDF8" stroke-width="14" stroke-linecap="round" opacity="0.85" />
    <path d="M 426 108 C 464 142 486 186 486 236"
          fill="none" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" opacity="0.45" />

    <!-- Precision Core Pulse (Optical Center Node) -->
    <circle cx="270" cy="276" r="20" fill="#FFFFFF" />
    <circle cx="270" cy="276" r="10" fill="#2563EB" />

    <!-- High-speed Satellite Pulse (Signal Transmission Beacon) -->
    <circle cx="434" cy="234" r="8" fill="#38BDF8" />
  </g>
</svg>
