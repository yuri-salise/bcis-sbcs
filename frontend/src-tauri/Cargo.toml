[package]
name = "bcis-desktop"
version = "1.0.0"
description = "BCIS Subscription Billing and Collection System Desktop Client"
edition = "2021"

[lib]
name = "bcis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
